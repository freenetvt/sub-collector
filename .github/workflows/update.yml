name: Auto Update Subscription Pool

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Xray-knife (with fallback)
        continue-on-error: true
        run: |
          wget -q https://github.com/lilendian0x00/xray-knife/releases/latest/download/Xray-knife-linux-64.zip -O knife.zip
          unzip -o -q knife.zip
          chmod +x Xray-knife* || true
          rm -f knife.zip
          ls -la

      - name: Run collector script
        run: python collector.py

      - name: Commit and push updated configs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sub.txt sub_b64.txt protocols/
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update configs [skip ci]" && git push)
