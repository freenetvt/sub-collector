name: Auto Update Subscription Pool

on:
  schedule:
    # اجرای خودکار هر 6 ساعت یک‌بار
    - cron: '0 */6 * * *'
  # امکان اجرای دستی در هر لحظه
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Xray-knife for Real Delay Testing
        run: |
          wget -q https://github.com/lilendian0x00/xray-knife/releases/latest/download/Xray-knife-linux-64.zip
          unzip -q Xray-knife-linux-64.zip
          chmod +x Xray-knife
          rm Xray-knife-linux-64.zip

      - name: Run collector and real delay tester
        run: python collector.py

      - name: Commit and push updated configs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sub.txt sub_b64.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update healthy configs [skip ci]" && git push)
