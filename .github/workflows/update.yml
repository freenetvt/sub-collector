name: Auto Update Subscription Pool

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run collector script (TCP Ping)
        env:
          SOURCE_FILE: "sources.txt"
          PING_TIMEOUT: "2.5"
          MAX_WORKERS: "120"
          MAX_CANDIDATES: "6000"
        run: python collector.py

      - name: Commit and push updated configs
        run: |
          mkdir -p protocols
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git status
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-update configs [skip ci]"
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push
          else
            echo "No changes to commit."
          fi
